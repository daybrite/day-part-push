[package]
name = "day-part-push"
version = "0.2.1"
edition = "2024"
rust-version = "1.100"
license = "MPL-2.0"
repository = "https://github.com/daybrite/day-part-push"
description = "Native push services for Day apps"
include = ["/src/**", "/Cargo.toml", "/README.md", "/docs/**", "/LICENSE"]

[package.metadata.day]
compat = "0.*"

[lints]
workspace = true

[dependencies]
day-bridge = "0.*"
day-process = "0.*"
day-part-permissions = "0.*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
day-part-http = { version = "0.*", optional = true }
url = { version = "2", optional = true }

[features]
relay = ["dep:day-part-http", "dep:url"]
default = ["ios-apns", "android-fcm"]
ios-apns = ["dep:day-part-push-ios-apns"]
android-fcm = ["dep:day-part-push-android-fcm"]

[target.'cfg(target_os = "ios")'.dependencies]
day-part-push-ios-apns = { version = "0.*", path = "crates/ios-apns", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
day-part-push-android-fcm = { version = "0.*", path = "crates/android-fcm", optional = true }

[workspace]
members = ["crates/ios-apns", "crates/android-fcm"]
exclude = ["demo"]

# Lint policy for every member (each inherits it with `[lints] workspace = true`): Clippy's
# `pedantic` group is on, and CI treats every warning as an error (`-D warnings`). The table
# matches the one in `day`.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"
