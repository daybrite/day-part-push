[package]
publish = false
name = "push-lab"
version.workspace = true
edition = "2024"

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/reference/project-structure).
default = ["mock"]
ios-apns = ["day-part-push/ios-apns"]
android-fcm = ["day-part-push/android-fcm"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit", "ios-apns"]
material = ["day/material"]
winui = ["day/winui"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# Cargo defaults to rlib; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"

[dependencies]
day = { package = "day-app", version = "0.*" }
day-part-push = { version = "0.*", path = "..", default-features = false }
serde_json = "1"

[build-dependencies]
day-build = { version = "0.*" }


[workspace]

[workspace.package]
version = "0.1.0"
